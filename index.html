    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Loan Repayment Calculator",
        "url": "https://loan-repayment-calculator.correia95.workers.dev/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "AUD" },
        "description": "Calculate loan repayments, total interest and payoff date, and model extra repayments, offset accounts and fortnightly payments."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How is a loan repayment calculated?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The repayment is the fixed amount that pays the loan to zero over its term. Each payment covers the interest charged since the last payment, and the remainder reduces the principal. As the balance falls, more of each payment goes to principal."
            }
          },
          {
            "@type": "Question",
            "name": "How much do fortnightly repayments save?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Paying half the monthly repayment every fortnight means 26 half-payments a year, the equivalent of 13 monthly payments. That extra month a year applied to principal typically clears a 30-year loan around four to five years early."
            }
          },
          {
            "@type": "Question",
            "name": "How does an offset account reduce interest?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The offset balance is subtracted from the loan balance before interest is calculated. A 20,000 dollar offset on a 6 percent loan saves roughly 1,200 dollars of interest a year, while the money stays available to you."
            }
          },
          {
            "@type": "Question",
            "name": "Does this calculator include fees or lenders mortgage insurance?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. It assumes a single fixed rate for the term and no fees. Add establishment fees or LMI to the amount borrowed if you want them reflected, and re-run the calculation whenever a variable rate changes."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

      <p style="text-align: center; padding: 20px">
        This loan repayment calculator needs JavaScript. It works out repayments, total interest and
        the payoff date for a loan, and the effect of extra repayments, an offset balance and
        fortnightly payments.
      </p>
    </noscript>
  </body>
